Insertion Sort - Adımlar:

Verilen dizi: [22, 27, 16, 2, 18, 6]

Insertion Sort, sıralı bir alt dizi oluşturur ve her adımda, dizinin geri kalanını bu sıralı alt diziyi kullanarak uygun yere yerleştirir.

Adım 1: İlk eleman (22) sıralıdır, çünkü o tek başına yer alır.

Adım 2: 27, sıralı alt dizinin sonuna eklenir çünkü 27 > 22.

Son durumda: [22, 27, 16, 2, 18, 6]

Adım 3: 16, sıralı alt dizinin yerinde olmamalıdır. 27'nin önüne yerleştirilir.

Son durumda: [16, 22, 27, 2, 18, 6]

Adım 4: 2, 16'nın önüne yerleştirilir. 16, 22, ve 27'yi sağa kaydırır.

Son durumda: [2, 16, 22, 27, 18, 6]

Adım 5: 18, 22'nin önüne yerleştirilir.

Son durumda: [2, 16, 18, 22, 27, 6]

Adım 6: 6, 16'nın önüne yerleştirilir. 16, 18, 22, ve 27'yi sağa kaydırır.

Son durumda: [2, 6, 16, 18, 22, 27]










Selection Sort - Adımlar:

Verilen dizi: [7, 3, 5, 8, 2, 9, 4, 15, 6]

Adım 1: Dizinin en küçük elemanını (2) bul ve başla olan yerle değiştir.

Son durumda: [2, 3, 5, 8, 7, 9, 4, 15, 6]

Adım 2: Kalan dizideki en küçük eleman (3) ile ikinci elemanı yer değiştir.

Son durumda: [2, 3, 5, 8, 7, 9, 4, 15, 6] (3 zaten doğru yerde olduğu için değişim yok)

Adım 3: Kalan dizideki en küçük eleman (4) ile üçüncü elemanı yer değiştir.

Son durumda: [2, 3, 4, 8, 7, 9, 5, 15, 6]

Adım 4: Kalan dizideki en küçük eleman (5) ile dördüncü elemanı yer değiştir.

Son durumda: [2, 3, 4, 5, 7, 9, 8, 15, 6]

